[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-greengpu"
version = "0.1.0"
description = "Reproducible GreenGPU research implementation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["nvidia-ml-py==13.615.71"]

[project.optional-dependencies]
plots = ["matplotlib==3.11.2"]

[project.scripts]
atlas = "greengpu.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
